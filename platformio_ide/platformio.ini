; FasterEdge MCU (PY32F003) — platformio_ide 版
; VS Code + PlatformIO 插件直接打开本目录即可编译/烧录/监视串口
; 本版本为「裸机 C + Cortex-M0+ 寄存器级参考实现（普冉 PY32 平台）」
;
; 使用方法（VS Code）:
;   1. 安装 PlatformIO IDE 插件
;   2. 打开本目录 (platformio_ide)
;   3. 底部状态栏点 Build / Upload / Serial Monitor
;
; 注意:
;   - PY32 平台基于 ARM GCC，需 py32 平台支持（pio 会自动拉取）
;   - fe_port.c 为 PY32F003 寄存器级参考实现（RCC/GPIO/USART/SysTick）
;   - 寄存器名/地址以普冉官方头文件为准，如有差异请按头文件微调
[env:py32f003f4p6]
platform = py32
board = py32f003f4p6
framework = none
monitor_speed = 115200
build_flags =
    -DFOSC=24000000UL
